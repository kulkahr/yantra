name: Yantra
options:
  bundleIdPrefix: app.firefly
  deploymentTarget:
    iOS: "17.0"
packages:
  ScaleKit:
    path: ../scalekit
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1
targets:
  Yantra:
    type: application
    platform: iOS
    sources: [Yantra]
    dependencies:
      - package: ScaleKit
    info:
      path: Yantra/Info.plist
      properties:
        CFBundleDisplayName: Yantra
        UILaunchScreen: {}
        NSBluetoothAlwaysUsageDescription: "Yantra connects to your realme Smart Scale to display and store your weight measurements locally on this device."
        NSBluetoothPeripheralUsageDescription: "Yantra connects to your realme Smart Scale to display and store your weight measurements locally on this device."
        NSHealthShareUsageDescription: "Yantra saves your body metrics to Apple Health only when you turn on Health export."
        NSHealthUpdateUsageDescription: "Yantra saves your body metrics to Apple Health only when you turn on Health export."
        UIBackgroundModes: [bluetooth-central]
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Yantra/Yantra.entitlements
      properties:
        com.apple.developer.healthkit: true
  YantraTests:
    type: bundle.unit-test
    platform: iOS
    sources: [YantraTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Yantra
schemes:
  Yantra:
    build:
      targets:
        Yantra: all
        YantraTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [YantraTests]
